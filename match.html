<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7fc">
  <title>连线配对 · AI Chinese Cloud</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="interaction-match.css">
</head>
<body data-page="match" data-activity-type="match" data-requires-open="true">
  <div class="app-shell">
    <div class="status-bar" aria-hidden="true">
      <span>11:20</span>
      <span class="status-icons">5G <span class="battery"></span></span>
    </div>

    <header class="page-header">
      <a class="icon-button" href="classroom.html" aria-label="返回课堂互动">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h1><span data-activity-title>连线配对</span><span class="header-subtitle" data-activity-subtitle>Hubungkan</span></h1>
      <span class="header-spacer"></span>
    </header>

    <main class="page page-content">
      <!-- 进度不再上屏：只留给读屏软件播报（视觉上隐藏，样式见 interaction-match.css） -->
      <p class="match-announcer" data-match-progress role="status" aria-live="polite">已找到 0 / 4 对</p>

      <section class="match-board" data-match-board aria-label="中文时间与印尼语配对题">
        <svg class="match-lines" data-match-lines aria-hidden="true"></svg>

        <div class="match-column">
          <button type="button" class="match-item" data-side="left" data-key="morning">
            <strong>早上</strong><span>zǎo shang</span>
          </button>
          <button type="button" class="match-item" data-side="left" data-key="noon">
            <strong>中午</strong><span>zhōng wǔ</span>
          </button>
          <button type="button" class="match-item" data-side="left" data-key="afternoon">
            <strong>下午</strong><span>xià wǔ</span>
          </button>
          <button type="button" class="match-item" data-side="left" data-key="evening">
            <strong>晚上</strong><span>wǎn shang</span>
          </button>
        </div>

        <div class="match-column">
          <button type="button" class="match-item" data-side="right" data-key="evening">
            <strong>malam</strong><span>🌙</span>
          </button>
          <button type="button" class="match-item" data-side="right" data-key="morning">
            <strong>pagi</strong><span>🌅</span>
          </button>
          <button type="button" class="match-item" data-side="right" data-key="noon">
            <strong>siang</strong><span>☀️</span>
          </button>
          <button type="button" class="match-item" data-side="right" data-key="afternoon">
            <strong>sore</strong><span>🌤️</span>
          </button>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="shared/seed-data.js"></script>
  <script type="module" src="shared/activity-types.js"></script>
  <script type="module" src="shared/activity-fab.js"></script>
  <script type="module" src="shared/platform-store.js"></script>
  <script type="module" src="shared/feedback-copy.js"></script>
  <script type="module" src="shared/feedback-modal.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module" src="shared/activity-page.js"></script>
</body>
</html>

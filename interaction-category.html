<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7fc">
  <title>分类归组 · AI Chinese Cloud</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="interaction-category.css">
</head>
<body data-page="activity" data-activity-type="category">
  <div class="app-shell">
    <div class="status-bar" aria-hidden="true">
      <span>11:20</span>
      <span class="status-icons">5G <span class="battery"></span></span>
    </div>

    <header class="page-header">
      <a class="icon-button" href="index.html" data-activity-back aria-label="返回首页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h1><span data-activity-title>分类归组</span><span class="header-subtitle" data-activity-subtitle>Kelompokkan kata</span></h1>
      <span class="header-spacer"></span>
    </header>

    <main class="page page-content">
      <section class="category-card" aria-labelledby="category-prompt">
        <div class="category-prompt-block">
          <h3 class="category-prompt" id="category-prompt"><span aria-hidden="true">🐼</span>把下面的词放进对应的类别里吧！</h3>
          <p class="category-prompt-id" lang="id">Ayo, kelompokkan kata-kata di bawah ini ke kategori yang tepat!</p>
        </div>

        <div class="category-pool-block">
          <div class="category-pool" role="group" aria-label="待归类的词" data-category-pool></div>
          <p class="category-pool-done hidden" data-category-pool-done>词都归好类了，点「提交」看看结果。<br><span lang="id">Semua kata sudah masuk kategori, tekan Kirim.</span></p>
        </div>

        <div class="category-groups" data-category-groups></div>

        <div class="category-actions">
          <button type="button" class="secondary-button" data-category-reset>
            <span data-category-reset-label>重置</span>
            <span class="category-btn-id" lang="id">Ulangi</span>
          </button>
          <button type="button" class="primary-button" data-category-submit disabled>
            <span data-category-submit-label>提交</span>
            <span class="category-btn-id" lang="id" data-category-submit-label-id>Kirim</span>
          </button>
        </div>

        <div class="category-feedback hidden" role="status" aria-live="polite" tabindex="-1" data-category-feedback>
          <strong class="category-feedback-title">
            <span aria-hidden="true" data-category-feedback-icon></span>
            <span data-category-feedback-title></span>
            <span class="category-feedback-title-id" lang="id" data-category-feedback-title-id></span>
          </strong>
          <p class="category-feedback-summary">
            <span data-category-feedback-summary-zh></span>
            <span class="category-feedback-summary-id" lang="id" data-category-feedback-summary-id></span>
          </p>
          <p class="category-feedback-copy">
            <span data-category-feedback-explain></span>
            <span class="category-feedback-explain-id" lang="id" data-category-feedback-explain-id></span>
          </p>
        </div>
      </section>

      <p class="category-announcer" role="status" aria-live="polite" data-category-announcer></p>
    </main>
  </div>

  <div class="modal-overlay hidden" data-category-complete>
    <section class="completion-modal" role="dialog" aria-modal="true" aria-labelledby="category-complete-title">
      <div class="modal-badge" data-category-modal-badge>🎉</div>
      <h3 id="category-complete-title" data-category-modal-title>答对了，真棒！</h3>
      <p class="id-copy" data-category-modal-id>Bagus! Semua kata sudah benar.</p>
      <p class="modal-description" data-category-modal-copy>
        <span data-category-modal-copy-zh></span>
        <span class="category-modal-id" lang="id" data-category-modal-copy-id></span>
      </p>
      <div class="category-modal-actions">
        <a class="primary-button" href="classroom.html?activities=1" data-category-change>换一个题型</a>
        <a class="secondary-button" href="classroom.html" data-category-return>返回课堂</a>
      </div>
    </section>
  </div>

  <script type="module" src="shared/activity-types.js"></script>
  <script type="module" src="shared/activity-fab.js"></script>
  <script type="module" src="shared/activity-bridge.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module" src="shared/activity-page.js"></script>
  <script type="module" src="interaction-category.js"></script>
</body>
</html>

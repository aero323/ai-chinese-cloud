<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7fc">
  <title>快速选择 · AI Chinese Cloud</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="interaction-choice.css">
</head>
<body data-page="activity" data-activity-type="choice">
  <div class="app-shell">
    <div class="status-bar" aria-hidden="true">
      <span>11:20</span>
      <span class="status-icons">5G <span class="battery"></span></span>
    </div>

    <header class="page-header">
      <a class="icon-button" href="index.html" data-activity-back aria-label="返回上一页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h1><span data-activity-title>快速选择</span><span class="header-subtitle" data-activity-subtitle>Pilihan cepat</span></h1>
      <span class="header-spacer"></span>
    </header>

    <main class="page page-content">
      <section class="choice-card" data-choice-card aria-labelledby="choice-question">
        <div class="choice-stem">
          <p class="choice-pinyin" data-choice-pinyin>Nǐ xiǎng hē shénme?</p>
          <h3 class="choice-question" id="choice-question" data-choice-question>你想喝什么？</h3>
        </div>

        <div class="choice-options" role="group" aria-labelledby="choice-question" data-choice-options></div>

        <button type="button" class="primary-button" data-choice-submit disabled>提交答案</button>

        <div class="choice-feedback hidden" role="status" aria-live="polite" data-choice-feedback>
          <strong class="choice-feedback-title">
            <span aria-hidden="true" data-choice-feedback-icon></span>
            <span data-choice-feedback-title></span>
          </strong>
          <p class="choice-feedback-answer hidden" data-choice-feedback-answer></p>
        </div>
      </section>

      <div class="choice-demo-row" role="group" aria-label="演示题目切换">
        <button type="button" class="choice-demo-chip is-active" data-choice-variant="single" aria-pressed="true">单选题</button>
        <button type="button" class="choice-demo-chip" data-choice-variant="multiple" aria-pressed="false">多选题</button>
      </div>
    </main>
  </div>

  <script type="module" src="shared/activity-types.js"></script>
  <script type="module" src="shared/activity-fab.js"></script>
  <script type="module" src="shared/activity-bridge.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module" src="shared/activity-page.js"></script>
  <script type="module" src="shared/feedback-copy.js"></script>
  <script type="module" src="shared/feedback-modal.js"></script>
  <script type="module" src="interaction-choice.js"></script>
</body>
</html>
